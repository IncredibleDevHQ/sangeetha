  <style type="text/css">@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } } @keyframes tulsi-sway { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(2deg) skewX(0.5deg); } 75% { transform: rotate(-2deg) skewX(-0.5deg); } }
@keyframes can-breathe { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-0.9deg) translateY(-0.4px); } }
@keyframes drop-fall { 0% { transform: translateY(-4px) scale(0.7); opacity: 0; } 20% { opacity: 0.95; } 75% { opacity: 0.8; } 100% { transform: translateY(8px) scale(1.05); opacity: 0; } }
@keyframes drop-float-right { 0% { transform: translateY(-3px) scale(0.8); opacity: 0; } 25% { opacity: 0.85; } 70% { opacity: 0.75; } 100% { transform: translateY(7px) scale(1); opacity: 0; } }
.anim-tulsi { transform-origin: 46px 44px; animation: tulsi-sway 4s ease-in-out 3; }
.anim-can { transform-origin: 30px 62px; animation: can-breathe 4s ease-in-out 3; }
.anim-drop-upper { animation: drop-fall 2s cubic-bezier(0.4, 0, 0.6, 1) 3; }
.anim-drop-lower { animation: drop-fall 2s cubic-bezier(0.4, 0, 0.6, 1) -0.9s 3; }
.anim-drop-right { animation: drop-float-right 2s cubic-bezier(0.4, 0, 0.6, 1) -1.4s 3; }</style>
