  <style type="text/css">@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } } @keyframes medallion-enter { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes stem-grow { 0% { transform: scaleY(0); opacity: 0; } 70% { transform: scaleY(1.04); opacity: 1; } 100% { transform: scaleY(1); opacity: 1; } }
@keyframes leaf-unfurl-lower { 0% { transform: scale(0) rotate(-6deg); opacity: 0; } 65% { transform: scale(1.08) rotate(2deg); opacity: 1; } 85% { transform: scale(0.98) rotate(-1deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
@keyframes leaf-unfurl-mid { 0% { transform: scale(0) rotate(-5deg); opacity: 0; } 65% { transform: scale(1.08) rotate(2deg); opacity: 1; } 85% { transform: scale(0.98) rotate(-1deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
@keyframes leaf-unfurl-upper { 0% { transform: scale(0) rotate(-4deg); opacity: 0; } 65% { transform: scale(1.08) rotate(1.5deg); opacity: 1; } 85% { transform: scale(0.98) rotate(-0.5deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
@keyframes leaf-unfurl-top { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes bead-enter { 0% { transform: scale(0) translateY(-4px); opacity: 0; } 60% { transform: scale(1.2) translateY(1px); opacity: 1; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
@keyframes rim-shimmer { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.95; } }
@keyframes leaf-idle-lower { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(1.6deg) scale(1.015); } }
@keyframes leaf-idle-mid { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(-1.4deg) scale(1.015); } }
@keyframes leaf-idle-upper { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(1.2deg) scale(1.01); } }
@keyframes leaf-idle-top { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(-0.8deg) scale(1.01); } }
@keyframes bead-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.8px); } }
.anim-medallion { transform-origin: 40px 39px; animation: medallion-enter 0.65s cubic-bezier(0.16, 1, 0.3, 1) both; }
.anim-stem { transform-origin: 40px 65px; animation: stem-grow 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
.anim-leaf-lower { transform-origin: 40px 54px; animation: leaf-unfurl-lower 0.65s cubic-bezier(0.34, 1.3, 0.64, 1) 0.45s backwards, leaf-idle-lower 5s ease-in-out 1.1s 3; }
.anim-leaf-mid { transform-origin: 40px 42px; animation: leaf-unfurl-mid 0.65s cubic-bezier(0.34, 1.3, 0.64, 1) 0.6s backwards, leaf-idle-mid 5s ease-in-out 1.25s 3; }
.anim-leaf-upper { transform-origin: 40px 30px; animation: leaf-unfurl-upper 0.65s cubic-bezier(0.34, 1.3, 0.64, 1) 0.75s backwards, leaf-idle-upper 5s ease-in-out 1.4s 3; }
.anim-leaf-top { transform-origin: 40px 22px; animation: leaf-unfurl-top 0.6s cubic-bezier(0.34, 1.3, 0.64, 1) 0.9s backwards, leaf-idle-top 5s ease-in-out 1.5s 3; }
.anim-bead { transform-origin: 40px 7.8px; animation: bead-enter 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) 0.35s backwards, bead-idle 5s ease-in-out 0.9s 3; }
.anim-rim { animation: rim-shimmer 5s ease-in-out 0.9s 3; }</style>
